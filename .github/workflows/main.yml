name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✨ Run Prettier
        run: npm run prettier-fix

      # - name: 🧪 Run Tests
      #   run: npm run test

      - name: 🔬 Lint
        run: npm run lint

      - name: 🛠️ Build
        run: npm run build

      - name: 🚀 Deploy
        run: npm run deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
         
