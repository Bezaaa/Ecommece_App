name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout your code
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      # Set up Node.js
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # Install dependencies
      - name: 📦 Install dependencies
        run: npm ci

      # Run Prettier
      - name: ✨ Run Prettier
        run: npm run prettier-fix

      # Run tests
      # - name: 🧪 Run Tests
      #   run: npm run test

      # Lint the code
      - name: 🔬 Lint
        run: npm run lint

      # Build the project
      - name: 🛠️ Build
        run: npm run build

      # Deploy to Vercel (this is where you integrate Vercel)
      - name: 🚀 Deploy to Vercel
        run: |
          # Install Vercel CLI
          npm install -g vercel

          # Link the project and automatically confirm with --yes
          vercel link --yes --token ${{ secrets.VERCEL_TOKEN }}

          # Deploy the project (this assumes you have already linked it correctly)
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }}


        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }} # Vercel token from GitHub Secrets

