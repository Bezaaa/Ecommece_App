name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout your code
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      # Set up Node.js
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # Install dependencies
      - name: 📦 Install dependencies
        run: npm ci

      # Run Prettier
      - name: ✨ Run Prettier
        run: npm run prettier-fix

      # Run tests (optional)
      # - name: 🧪 Run Tests
      #   run: npm run test

      # Lint the code
      - name: 🔬 Lint
        run: npm run lint

      # Build the project
      - name: 🛠️ Build
        run: npm run build

      # Deploy to Vercel
      - name: 🚀 Deploy to Vercel
        id: vercel-deploy
        run: |
          # Install Vercel CLI
          npm install -g vercel

          # Link the project automatically with --yes
          vercel link --yes --token ${{ secrets.VERCEL_TOKEN }}

          # Deploy the project (use --prod for production URL)
          DEPLOY_OUTPUT=$(vercel --prod --token ${{ secrets.VERCEL_TOKEN }})

          # Extract the deployment URL from output
          echo "DEPLOY_URL=$(echo $DEPLOY_OUTPUT | grep -oP 'https://[^\s]+')" >> $GITHUB_ENV

          echo "Deployment URL: $DEPLOY_URL"

      # Post both Preview + Production URLs as a PR comment
      - name: 📝 Post Deployment URLs as PR Comment
        if: github.event_name == 'pull_request'
        run: |
          # Your constant production URL - REPLACE this with your real URL!
          PRODUCTION_URL="https://ecommerce-six-orpin-69.vercel.app"

          # Check if DEPLOY_URL is set and post both URLs as a comment on PR
          if [ -n "$DEPLOY_URL" ]; then
            COMMENT_BODY="🚀 **Deployment complete!**\n\n🔗 **Preview URL:** $DEPLOY_URL\n🔗 **Production URL:** $PRODUCTION_URL"
            echo -e "$COMMENT_BODY"
            curl -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -d '{"body":"'"$COMMENT_BODY"'"}' \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          fi
        env:
          DEPLOY_URL: ${{ env.DEPLOY_URL }}
